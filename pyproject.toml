[project]
name = "dantek-bot-twitch"
version = "0.1.0"
description = "Chatbot Twitch IA"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.14.4",
    "python-dotenv>=1.2.4",
    "twitchio>=3.3.2",
]

[project.scripts]
dantek-bot-twitch = "dantek_bot_twitch:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"
